<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加權抽抽抽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:8px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.box{max-width:820px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
.hdr{background:linear-gradient(135deg,#667eea,#764ba2);padding:18px 14px;text-align:center;color:#fff}
.hdr h1{font-size:1.3rem;letter-spacing:1px;margin-bottom:2px}
.hdr p{font-size:.78rem;opacity:.85}
.sec{padding:14px 12px;border-bottom:1px solid #e8edf2}
.sec:last-child{border-bottom:none}
.stitle{font-size:.92rem;font-weight:700;color:#4a5568;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.stitle::before{content:"";width:4px;height:15px;background:linear-gradient(#667eea,#764ba2);border-radius:2px}
.add-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 10px;background:#faf5ff;border:2px dashed #b794f4;border-radius:10px;margin-bottom:12px}
.add-row input[type=text]{flex:1;min-width:0;padding:9px 10px;border:2px solid #b794f4;border-radius:8px;font-size:16px;font-family:inherit;outline:none}
.add-row input[type=number]{width:64px;padding:9px 6px;border:2px solid #b794f4;border-radius:8px;font-size:16px;font-family:inherit;outline:none;text-align:center}
.add-row input:focus{border-color:#667eea}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:480px}
thead tr{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
th{padding:8px 5px;text-align:center;font-weight:700;white-space:nowrap;font-size:.76rem}
td{padding:7px 4px;text-align:center;vertical-align:middle}
tbody tr:nth-child(odd){background:#f9fafb}
tbody tr:nth-child(even){background:#fff}
tbody tr.zrow{background:#f0fff4!important}
.ni{width:100%;padding:6px 4px;border:2px solid #e2e8f0;border-radius:6px;font-size:16px;text-align:center;outline:none;font-family:inherit;background:transparent}
.ni:focus{border-color:#667eea;background:#fff}
.di{width:52px;padding:6px 3px;border:2px solid #e2e8f0;border-radius:6px;font-size:16px;text-align:center;font-weight:700;outline:none;font-family:inherit;background:transparent}
.dz{border-color:#48bb78!important;background:#f0fff4!important;color:#276749!important}
.dn{border-color:#fc8181!important;background:#fff5f5!important;color:#c53030!important}
.pcell{min-width:85px}
.pbar-bg{background:#e2e8f0;border-radius:20px;height:7px;overflow:hidden;margin-top:2px}
.pbar-fill{height:7px;border-radius:20px;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .4s}
.ptxt{font-size:.76rem;font-weight:700;color:#553c9a}
.bdg{display:inline;font-size:.62rem;border-radius:9px;padding:0 4px;margin-left:2px;font-weight:700}
.bgg{background:#c6f6d5;color:#276749}
.bgr{background:#fed7e2;color:#c53030}
.dbtn{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:5px 9px;border-radius:6px;line-height:1}
tbody tr.drawn{background:#fed7e2!important;opacity:.6}
tbody tr.drawn td{text-decoration:line-through;color:#a0aec0}
tbody tr.drawn input{text-decoration:line-through;pointer-events:none}
.bi.on{background:linear-gradient(135deg,#f6ad55,#ed8936);box-shadow:0 0 10px rgba(246,173,85,.5)}
.acts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;padding:12px 10px;border-bottom:1px solid #e8edf2;background:#f9fafb}
.count-wrap{display:flex;align-items:center;gap:5px;background:#fff;padding:6px 9px;border-radius:8px;border:2px solid #e2e8f0}
.count-wrap label{font-size:.8rem;color:#4a5568;font-weight:700;white-space:nowrap}
.count-inp{width:48px;padding:7px 4px;border:2px solid #b794f4;border-radius:8px;font-size:16px;font-family:inherit;outline:none;text-align:center;font-weight:700}
.count-inp:focus{border-color:#667eea}
.btn{padding:10px 14px;border:none;border-radius:8px;font-size:.88rem;font-family:inherit;cursor:pointer;font-weight:700;white-space:nowrap;transition:transform .15s,box-shadow .15s;min-height:42px;-webkit-user-select:none;user-select:none}
.bs{background:linear-gradient(135deg,#48bb78,#38a169);color:#fff}
.bw{background:linear-gradient(135deg,#f6ad55,#ed8936);color:#fff}
.bd{background:linear-gradient(135deg,#fc8181,#e53e3e);color:#fff}
.bi{background:linear-gradient(135deg,#63b3ed,#3182ce);color:#fff}
.blg{padding:13px 24px;font-size:.95rem;min-height:48px}
.bsm{padding:7px 12px;font-size:.8rem;min-height:36px}
.rbox{margin:12px;border-radius:12px;padding:16px 12px;text-align:center;background:#f7f5ff;border:2px dashed #b794f4;min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rbox.flash{animation:rp .5s ease;background:linear-gradient(135deg,#fff5f5,#fef2f2);border-color:#fc8181}
@keyframes rp{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.rw{font-size:.82rem;color:#a0aec0}
.rwin{font-size:1.2rem;font-weight:700;color:#e53e3e}
.rtags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.rtag{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:5px 11px;border-radius:20px;font-size:.82rem;font-weight:700}
.hlist{list-style:none;display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto}
.hlist li{padding:6px 10px;background:#f7f5ff;border-left:4px solid #667eea;border-radius:0 6px 6px 0;font-size:.78rem;color:#4a5568}
.hlist li.hc{background:#fffff0;border-left-color:#f6e05e}
.hemp{color:#a0aec0;font-size:.8rem;text-align:center;padding:8px}
#ov1{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;justify-content:center;align-items:center}
#ov1.on{display:flex}
.slot{background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460);border:3px solid #f6ad55;border-radius:16px;padding:28px 20px;text-align:center;box-shadow:0 0 45px rgba(246,173,85,.4);margin:0 12px}
.stit{color:#f6ad55;font-size:.85rem;letter-spacing:3px;margin-bottom:18px;animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.sdisp{background:#050505;border:2px solid #4a9eff;border-radius:10px;padding:13px 18px;font-size:1.4rem;font-weight:700;color:#4affb4;min-width:0;min-height:52px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 16px rgba(74,159,255,.2)}
.sdisp.roll{animation:cs .12s infinite}
@keyframes cs{0%{color:#4affb4}25%{color:#f6ad55}50%{color:#fc8181}75%{color:#b794f4}100%{color:#4affb4}}
.sdots{margin-top:14px;display:flex;gap:8px;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#2d3748;transition:all .3s}
.dot.on{background:#f6ad55;box-shadow:0 0 6px #f6ad55}
.slot-prog{color:#a0aec0;font-size:.78rem;margin-top:10px;letter-spacing:1px}
.skipbtn{margin-top:14px;padding:9px 24px;background:transparent;border:2px solid #4a9eff;color:#4a9eff;border-radius:22px;font-size:.85rem;font-family:inherit;font-weight:700;cursor:pointer;transition:background .2s,color .2s;-webkit-user-select:none;user-select:none}
.skipbtn:active{background:#4a9eff;color:#fff}
#ov2{display:none;position:fixed;inset:0;z-index:2000;justify-content:center;align-items:center;background:rgba(0,0,0,.75)}
#ov2.on{display:flex;animation:bgPulse 2s ease-in-out infinite}
#cv{position:fixed;inset:0;pointer-events:none;z-index:2001}
@keyframes bgPulse{0%,100%{background:rgba(0,0,0,.75)}50%{background:rgba(30,0,60,.85)}}
.chosen-card{position:relative;z-index:2002;background:linear-gradient(160deg,#fff 60%,#f3e8ff 100%);border-radius:20px;padding:28px 18px 22px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 0 3px #ffd700,0 0 30px rgba(255,215,0,.6),0 0 60px rgba(255,215,0,.3);animation:pop .8s cubic-bezier(.34,1.56,.64,1),cardGlow 2s ease-in-out infinite .8s;max-width:340px;width:90%;overflow:hidden}
.chosen-card.chosen-mode{animation:pop .75s cubic-bezier(.34,1.56,.64,1),cardGlow 1.8s ease-in-out infinite .6s}
.chosen-card.loser-mode{animation:pop .75s cubic-bezier(.34,1.56,.64,1),loserGlow 1.4s ease-in-out infinite .6s}
.chosen-card::before{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 2.5s ease-in-out infinite 1s;pointer-events:none}
@keyframes shine{0%{left:-100%}40%,100%{left:150%}}
@keyframes cardGlow{0%,100%{box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 0 3px #ffd700,0 0 30px rgba(255,215,0,.6),0 0 60px rgba(255,215,0,.3)}50%{box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 0 3px #ffd700,0 0 45px rgba(255,215,0,.9),0 0 90px rgba(255,215,0,.5)}}
@keyframes loserGlow{0%,100%{box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 0 3px #ff8a80,0 0 35px rgba(255,82,82,.62),0 0 70px rgba(255,82,82,.32)}50%{box-shadow:0 15px 40px rgba(0,0,0,.35),0 0 0 3px #ff5252,0 0 50px rgba(255,82,82,.88),0 0 100px rgba(255,82,82,.5)}}
@keyframes pop{0%{transform:scale(0) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.ccrown{font-size:3.2rem;animation:crownFloat 1.8s ease-in-out infinite;display:block;margin-bottom:0;filter:drop-shadow(0 0 10px rgba(255,215,0,.9))}
@keyframes crownFloat{0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}50%{transform:translateY(-10px) rotate(5deg) scale(1.08)}}
.clbl{font-size:.95rem;letter-spacing:4px;margin:4px 0 8px;font-weight:700;background:linear-gradient(90deg,#667eea,#f6ad55,#fc8181,#764ba2,#667eea);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:rainbow 3s linear infinite}
@keyframes rainbow{0%{background-position:0%}100%{background-position:200%}}
.cname{font-size:2.2rem;font-weight:700;color:#2d3748;margin:4px 0;animation:nameJump 1s ease-in-out infinite .8s;text-shadow:2px 2px 0 rgba(102,126,234,.2);word-break:break-all}
@keyframes nameJump{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.cprob{font-size:.78rem;color:#e53e3e;font-weight:700;margin-top:8px;background:#fff5f5;padding:4px 11px;border-radius:20px;display:inline-block;animation:probBlink 1.2s ease-in-out infinite;border:1px solid #fc8181}
@keyframes probBlink{0%,100%{background:#fff5f5;box-shadow:0 0 0 rgba(252,129,129,0)}50%{background:#fed7e2;box-shadow:0 0 10px rgba(252,129,129,.6)}}
.cbtn{margin-top:18px;padding:12px 34px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:28px;font-size:1rem;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;min-height:46px;-webkit-user-select:none;user-select:none}
.cbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);opacity:0;transition:opacity .2s}
.cbtn:active{transform:scale(.97)}
.csub{margin-top:4px;color:#4a5568;font-weight:700;letter-spacing:1px;font-size:.85rem}
.clist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.ctag{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:700;box-shadow:0 4px 12px rgba(118,75,162,.35);animation:tagPop .9s ease-in-out infinite alternate}
@keyframes tagPop{from{transform:translateY(0)}to{transform:translateY(-2px)}}
#toast{position:fixed;bottom:20px;left:12px;right:12px;transform:translateY(80px);background:#2d3748;color:#fff;padding:11px 18px;border-radius:24px;font-size:.85rem;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translateY(0)}
#mdl{display:none;position:fixed;inset:0;z-index:3000;justify-content:center;align-items:center;background:rgba(0,0,0,.6);padding:20px}
#mdl.on{display:flex}
.mdl-box{background:#fff;border-radius:16px;padding:24px 20px 18px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .25s ease}
.mdl-msg{font-size:1rem;color:#2d3748;font-weight:700;line-height:1.6;margin-bottom:20px;word-break:break-all}
.mdl-actions{display:flex;gap:10px}
.mdl-btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:.95rem;font-family:inherit;font-weight:700;cursor:pointer;min-height:44px;-webkit-user-select:none;user-select:none}
.mdl-cancel{background:#e2e8f0;color:#4a5568}
.mdl-ok{background:linear-gradient(135deg,#fc8181,#e53e3e);color:#fff}
.mdl-btn:active{transform:scale(.97)}

/* ===== 平板以上 (≥600px) ===== */
@media(min-width:600px){
  body{padding:14px}
  .box{border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.3)}
  .hdr{padding:22px 24px}
  .hdr h1{font-size:1.6rem;letter-spacing:2px}
  .hdr p{font-size:.88rem}
  .sec{padding:18px 24px}
  .stitle{font-size:1rem;margin-bottom:12px}
  .stitle::before{height:17px}
  .add-row{padding:14px 14px;gap:10px;border-radius:12px}
  .add-row input[type=text]{max-width:200px;font-size:.95rem;padding:8px 11px}
  .add-row input[type=number]{font-size:.95rem;padding:8px 8px;width:80px}
  .tw{border-radius:10px}
  table{font-size:.9rem;min-width:0}
  th{padding:10px 8px;font-size:.88rem}
  td{padding:8px 10px}
  .ni{font-size:.9rem;padding:6px 7px}
  .di{width:64px;padding:6px 7px;font-size:.9rem}
  .pcell{min-width:110px}
  .pbar-bg{height:8px;margin-top:3px}
  .pbar-fill{height:8px}
  .ptxt{font-size:.85rem}
  .bdg{font-size:.68rem;padding:1px 6px}
  .acts{padding:16px 24px;gap:10px}
  .count-wrap{padding:7px 12px;gap:6px}
  .count-wrap label{font-size:.85rem}
  .count-inp{width:58px;padding:6px 8px;font-size:.9rem}
  .btn{padding:9px 18px;font-size:.9rem;min-height:40px}
  .blg{padding:12px 32px;font-size:1.05rem;min-height:44px}
  .bsm{padding:6px 14px;font-size:.83rem;min-height:34px}
  .rbox{margin:18px 24px;padding:18px;min-height:75px}
  .rw{font-size:.92rem}
  .rwin{font-size:1.4rem}
  .rtag{font-size:.92rem;padding:5px 14px}
  .hlist li{font-size:.84rem}
  .hlist{max-height:170px}
  .slot{padding:34px 40px;border-radius:18px;box-shadow:0 0 60px rgba(246,173,85,.4);margin:0}
  .stit{font-size:.95rem;letter-spacing:4px;margin-bottom:22px}
  .sdisp{font-size:1.8rem;padding:15px 24px;min-height:60px}
  .sdots{gap:9px}
  .dot{width:9px;height:9px}
  .slot-prog{font-size:.85rem}
  .chosen-card{border-radius:22px;padding:36px 44px 30px;max-width:400px}
  .ccrown{font-size:4.5rem}
  .clbl{font-size:1.1rem;letter-spacing:5px}
  .cname{font-size:3rem}
  .cprob{font-size:.82rem}
  .csub{font-size:.92rem}
  .ctag{font-size:.9rem;padding:6px 14px}
  #toast{left:50%;right:auto;transform:translateX(-50%) translateY(80px);white-space:nowrap;padding:11px 24px}
  #toast.on{transform:translateX(-50%) translateY(0)}
}

/* ===== 桌電 (≥820px) ===== */
@media(min-width:820px){
  body{padding:20px}
  .box{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .hdr{padding:28px}
  .hdr h1{font-size:1.9rem}
  .sec{padding:22px 28px}
  .add-row input[type=text]{max-width:180px}
  .pcell{min-width:130px}
  .pbar-bg{height:9px}
  .pbar-fill{height:9px}
  .ptxt{font-size:.88rem}
  .acts{padding:18px 28px}
  .rbox{margin:22px 28px;padding:22px;min-height:80px}
  .rwin{font-size:1.5rem}
  .chosen-card{border-radius:24px;padding:44px 52px 36px;max-width:420px}
  .ccrown{font-size:5.5rem}
  .clbl{font-size:1.2rem;letter-spacing:6px}
  .cname{font-size:3.6rem}
  .cbtn:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .cbtn:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(102,126,234,.6)}
  .cbtn:hover::after{opacity:1}
  .dbtn:hover{background:#fed7e2}
}
@media(hover:hover){
  .btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .cbtn:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(102,126,234,.6)}
  .cbtn:hover::after{opacity:1}
  .dbtn:hover{background:#fed7e2}
}
</style>
</head>
<body>
<div class="box">
  <div class="hdr">
    <h1>命運抽籤程式</h1>
    <p>加權越多，抽中機率越高 ／ 零加權者機率最低</p>
  </div>

  <div class="sec">
    <div class="stitle">人員管理</div>
    <div class="add-row">
      <strong style="color:#553c9a;white-space:nowrap">➕ 新增</strong>
      <input type="text"   id="iName" placeholder="姓名" maxlength="20">
      <input type="number" id="iDays" placeholder="加權" min="0" max="999" step="0.1" value="0">
      <button class="btn bs" id="btnAdd">＋ 新增</button>
      <input type="file" id="csvFile" accept=".csv" style="display:none">
      <button class="btn bi" id="btnImport">📥 匯入CSV</button>
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>姓名</th>
            <th>加權</th>
            <th>抽中機率</th>
            <th style="width:46px">移除</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <div class="acts">
    <div class="count-wrap">
      <label>🎯 本次抽取</label>
      <input type="number" id="drawCount" class="count-inp" value="1" min="1" max="50" step="1" inputmode="numeric">
      <label>人</label>
    </div>
    <button class="btn bs"     id="btnRefresh">🔄 更新機率</button>
    <button class="btn bw blg" id="btnDraw">🎲 開始抽籤</button>
    <button class="btn bi bsm" id="btnRepeat">🔁 重複抽取</button>
    <button class="btn bd bsm" id="btnReset">🔄 重置抽籤</button>
    <button class="btn bi bsm" id="btnSave">💾 儲存人員</button>
    <button class="btn bd bsm" id="btnClearPpl">🗑 清除人員</button>
    <button class="btn bd bsm" id="btnClear">🗑 清除紀錄</button>
  </div>

  <div class="rbox" id="rbox">
    <div class="rw">尚未抽籤，請先新增人員再按「開始抽籤」</div>
  </div>

  <div class="sec">
    <div class="stitle">抽籤歷史</div>
    <ul class="hlist" id="hl"><li class="hemp">尚無紀錄</li></ul>
  </div>
</div>

<!-- Slot Overlay -->
<div id="ov1">
  <div class="slot">
    <div class="stit">▶ 抽 籤 進 行 中 ◀</div>
    <div class="sdisp" id="sd">???</div>
    <div class="sdots">
      <div class="dot" id="dt0"></div><div class="dot" id="dt1"></div>
      <div class="dot" id="dt2"></div><div class="dot" id="dt3"></div>
      <div class="dot" id="dt4"></div>
    </div>
    <div class="slot-prog" id="slotProg"></div>
    <button class="skipbtn" id="btnSkip">⏭ 跳過動畫</button>
  </div>
</div>

<!-- 天選之人 Overlay（白底卡片） -->
<div id="ov2">
  <canvas id="cv"></canvas>
  <div class="chosen-card" id="chosenCard">
    <span class="ccrown" id="ccrown">👑</span>
    <div class="clbl">✦ 天 選 之 人 ✦</div>
    <div class="cname"  id="cname"></div>
    <div class="clist"  id="clist"></div>
    <div class="csub"   id="csub"></div>
    <div class="cprob"  id="cprob"></div>
    <button class="cbtn" id="btnClose">我認命了</button>
  </div>
</div>

<div id="toast"></div>

<!-- 確認對話框 -->
<div id="mdl">
  <div class="mdl-box">
    <div class="mdl-msg" id="mdlMsg"></div>
    <div class="mdl-actions">
      <button class="mdl-btn mdl-cancel" id="mdlCancel">取消</button>
      <button class="mdl-btn mdl-ok" id="mdlOk">確定</button>
    </div>
  </div>
</div>

<script>
var SK_P='lp6_ppl', SK_H='lp6_hist';
var PWR=1.585;
var ppl=[], hist=[], cfId=null;
var repeatOn=false, drawnNames={}, repeatOrder=[];
var slotSkip=false, slotFinish=null;

/* ---- 工具 ---- */
function jLoad(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function jSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function eh(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,w){
  var t=document.getElementById('toast');
  t.textContent=m; t.style.background=w?'#c53030':'#2d3748';
  t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},2400);
}
/* 高品質亂數：優先使用 crypto，否則退回 Math.random */
function rnd(){
  if(window.crypto && window.crypto.getRandomValues){
    var a=new Uint32Array(1);
    window.crypto.getRandomValues(a);
    return a[0]/4294967296;
  }
  return Math.random();
}
/* 震動回饋（手機支援才作用） */
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
/* 自製確認框（取代手機無法自訂樣式的 confirm）*/
function showConfirm(msg, onOk){
  var ov=document.getElementById('mdl');
  var ok=document.getElementById('mdlOk');
  var cancel=document.getElementById('mdlCancel');
  document.getElementById('mdlMsg').textContent=msg;
  ov.classList.add('on');
  function cleanup(){
    ov.classList.remove('on');
    ok.removeEventListener('click',hOk);
    cancel.removeEventListener('click',hCancel);
    ov.removeEventListener('click',hOv);
  }
  function hOk(){ cleanup(); if(onOk) onOk(); }
  function hCancel(){ cleanup(); }
  function hOv(e){ if(e.target===ov) cleanup(); }
  ok.addEventListener('click',hOk);
  cancel.addEventListener('click',hCancel);
  ov.addEventListener('click',hOv);
}

/* ---- 權重 ---- */
function weights(){
  return ppl.map(function(p){
    return Math.pow(p.days + 1, PWR);
  });
}
function sumW(w){var s=0;for(var i=0;i<w.length;i++)s+=w[i];return s;}
function pickW(w,total){
  var s=(typeof total==='number')?total:sumW(w),r=rnd()*s;
  for(var i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}
  return w.length-1;
}

/* ---- 顯示機率：本輪入選機率（count>=2 用固定種子蒙地卡羅，數字穩定不跳動）---- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function getDisplayProbs(){
  var wAll=weights();
  var out=ppl.map(function(){return 0;});
  var active=[];
  for(var i=0;i<ppl.length;i++){ if(!drawnNames[ppl[i].name]) active.push(i); }
  var n=active.length;
  if(n===0) return out;
  var c=parseInt(document.getElementById('drawCount').value,10)||1;
  if(c<1) c=1; if(c>n) c=n;
  if(c>=n){ for(var a=0;a<n;a++) out[active[a]]=100; return out; }
  var poolW=[];
  for(var a=0;a<n;a++) poolW.push(wAll[active[a]]);
  var W=0; for(var a=0;a<n;a++) W+=poolW[a];
  if(c<=1){ for(var a=0;a<n;a++) out[active[a]]=poolW[a]/W*100; return out; }
  var sims=Math.max(4000, Math.min(20000, Math.floor(3000000/Math.max(1,c*n)))), seed=2166136261>>>0;
  for(var a=0;a<n;a++){ seed^=Math.round(poolW[a]*1000); seed=Math.imul(seed,16777619); }
  seed^=c; seed=Math.imul(seed,16777619);
  seed^=n; seed=Math.imul(seed,16777619);
  seed=seed>>>0;
  var rng=mulberry32(seed);
  var cnt=new Array(n); for(var a=0;a<n;a++) cnt[a]=0;
  var pw=new Array(n), ord=new Array(n);
  for(var s=0;s<sims;s++){
    for(var a=0;a<n;a++){ pw[a]=poolW[a]; ord[a]=a; }
    var tot=W;
    for(var k=0;k<c;k++){
      var r=rng()*tot, j=0;
      for(;j<pw.length;j++){ r-=pw[j]; if(r<=0) break; }
      if(j>=pw.length) j=pw.length-1;
      cnt[ord[j]]++;
      tot-=pw[j];
      pw.splice(j,1); ord.splice(j,1);
    }
  }
  for(var a=0;a<n;a++) out[active[a]]=cnt[a]/sims*100;
  return out;
}

/* ---- 渲染表格 ---- */
function render(){
  var tb=document.getElementById('tb');
  tb.innerHTML='';
  if(ppl.length===0){
    tb.innerHTML='<tr><td colspan="5" style="padding:18px;color:#a0aec0">尚無人員，請在上方新增</td></tr>';
    return;
  }
  var disp=getDisplayProbs();
  var maxD=0; for(var j=0;j<ppl.length;j++){var dj=Math.round(ppl[j].days*10); if(dj>maxD) maxD=dj;}
  for(var i=0;i<ppl.length;i++){
    (function(i){
      var p=ppl[i];
      var isMax=(Math.round(p.days*10)===maxD && maxD>0);
      var prob=disp[i];
      var tr=document.createElement('tr');
      var cls=isMax?'zrow':'';
      if(drawnNames[p.name]) cls=cls?cls+' drawn':'drawn';
      tr.className=cls;
      var bdg='';
      if(isMax) bdg='<span class="bdg bgg">🔝最高</span>';
      else if(p.days===0) bdg='<span class="bdg bgr">⚠低</span>';
      tr.innerHTML=
        '<td style="color:#a0aec0">'+(i+1)+'</td>'+
        '<td><input class="ni" type="text" value="'+eh(p.name)+'" id="n'+i+'"></td>'+
        '<td><input class="di '+(isMax?'dz':p.days===0?'dn':'')+'" type="number" value="'+p.days.toFixed(1)+'" min="0" max="999" step="0.1" id="d'+i+'"></td>'+
        '<td class="pcell" id="pc'+i+'">'+
          '<div class="ptxt">'+prob.toFixed(1)+'%'+bdg+'</div>'+
          '<div class="pbar-bg"><div class="pbar-fill" style="width:'+Math.min(100,prob).toFixed(1)+'%"></div></div>'+
        '</td>'+
        '<td><button class="dbtn" id="del'+i+'">🗑</button></td>';
      tb.appendChild(tr);
      document.getElementById('n'+i).addEventListener('change',function(){
        var oldName=ppl[i].name;
        var newName=this.value.trim()||'人員'+(i+1);
        if(newName===oldName) return;
        for(var k=0;k<ppl.length;k++){
          if(k!==i && ppl[k].name===newName){ toast('⚠ 姓名重複',true); this.value=oldName; return; }
        }
        if(drawnNames[oldName]){ delete drawnNames[oldName]; drawnNames[newName]=true; }
        for(var k2=0;k2<repeatOrder.length;k2++){ if(repeatOrder[k2].name===oldName) repeatOrder[k2].name=newName; }
        ppl[i].name=newName;
      });
      document.getElementById('d'+i).addEventListener('input',function(){
        var d=Math.round(Math.max(0,parseFloat(this.value)||0)*10)/10;
        ppl[i].days=d;
        syncRowClasses();
        refreshP();
      });
      document.getElementById('del'+i).addEventListener('click',function(){
        var nm=ppl[i].name;
        showConfirm('移除「'+nm+'」？', function(){
          ppl.splice(i,1);
          delete drawnNames[nm];
          repeatOrder=repeatOrder.filter(function(x){return x.name!==nm;});
          render();
          toast('🗑 已移除「'+nm+'」');
        });
      });
    })(i);
  }
}

function refreshP(){
  if(!ppl.length) return;
  var disp=getDisplayProbs();
  var maxD=0; for(var j=0;j<ppl.length;j++){var dj=Math.round(ppl[j].days*10); if(dj>maxD) maxD=dj;}
  for(var i=0;i<ppl.length;i++){
    var c=document.getElementById('pc'+i); if(!c) continue;
    var isMax=(Math.round(ppl[i].days*10)===maxD && maxD>0);
    var prob=disp[i];
    var bdg='';
    if(isMax) bdg='<span class="bdg bgg">🔝最高</span>';
    else if(ppl[i].days===0) bdg='<span class="bdg bgr">⚠低</span>';
    c.querySelector('.ptxt').innerHTML=prob.toFixed(1)+'%'+bdg;
    c.querySelector('.pbar-fill').style.width=Math.min(100,prob).toFixed(1)+'%';
  }
}

/* ---- 同步列樣式（不重建表格，保留輸入焦點）---- */
function syncRowClasses(){
  if(!ppl.length) return;
  var maxD=0; for(var j=0;j<ppl.length;j++){var dj=Math.round(ppl[j].days*10); if(dj>maxD) maxD=dj;}
  var rows=document.querySelectorAll('#tb tr');
  for(var i=0;i<ppl.length;i++){
    if(!rows[i]) continue;
    var isMax=(Math.round(ppl[i].days*10)===maxD && maxD>0);
    var cls=isMax?'zrow':'';
    if(drawnNames[ppl[i].name]) cls=cls?cls+' drawn':'drawn';
    rows[i].className=cls;
    var dEl=document.getElementById('d'+i);
    if(dEl) dEl.className='di '+(isMax?'dz':ppl[i].days===0?'dn':'');
  }
}

/* ---- 新增人員 ---- */
function addPerson(){
  var ne=document.getElementById('iName'), de=document.getElementById('iDays');
  var name=ne.value.trim(), days=Math.round(Math.max(0,parseFloat(de.value)||0)*10)/10;
  if(!name){toast('⚠ 請輸入姓名',true); ne.focus(); return;}
  for(var i=0;i<ppl.length;i++){
    if(ppl[i].name===name){toast('⚠ 姓名重複',true); ne.focus(); return;}
  }
  ppl.push({name:name,days:days});
  ne.value=''; de.value='0'; ne.focus();
  render();
  toast('✅ 已新增「'+name+'」');
}

/* ---- 儲存/清除 ---- */
function saveData(){
  if(!ppl.length){toast('⚠ 尚無人員',true); return;}
  jSave(SK_P,ppl); toast('💾 已儲存 '+ppl.length+' 筆');
}
function clearHist(){
  showConfirm('確定清除所有紀錄？', function(){
    hist=[]; jSave(SK_H,hist); renderH(); toast('🗑 已清除');
  });
}
function clearPpl(){
  showConfirm('確定清除所有人員？', function(){
    ppl=[]; drawnNames={}; repeatOrder=[]; repeatOn=false;
    var btn=document.getElementById('btnRepeat');
    btn.classList.remove('on'); btn.textContent='🔁 重複抽取(關閉)';
    jSave(SK_P,ppl);
    document.getElementById('rbox').innerHTML='<div class="rw">尚未抽籤，請先新增人員再按「開始抽籤」</div>';
    render();
    toast('🗑 人員已全部清除');
  });
}

/* ---- 歷史 ---- */
function renderH(){
  var ul=document.getElementById('hl'); ul.innerHTML='';
  if(!hist.length){ul.innerHTML='<li class="hemp">尚無紀錄</li>'; return;}
  for(var i=hist.length-1;i>=0;i--){
    var li=document.createElement('li');
    if(hist[i].c) li.className='hc';
    li.textContent=hist[i].t; ul.appendChild(li);
  }
}
function pushH(t,c){hist.push({t:t,c:!!c}); jSave(SK_H,hist); renderH();}

/* ---- 抽籤主流程 ---- */
function drawLottery(){
  if(repeatOn){
    drawSingleRepeat(); return;
  }
  slotSkip=false; slotFinish=null;
  var count=Math.max(1,parseInt(document.getElementById('drawCount').value,10)||1);
  if(ppl.length===0){toast('⚠ 請先新增人員',true); return;}
  if(ppl.length<2){toast('⚠ 至少需要 2 位人員',true); return;}
  if(count>ppl.length){toast('⚠ 抽取人數不能超過總人數（'+ppl.length+'人）',true); return;}

  /* 不放回抽樣 */
  var w=weights();
  var pool=ppl.slice();   /* 複製陣列，不影響原始 */
  var poolW=w.slice();
  var winners=[];
  var probs=[];
  var poolTotal=sumW(poolW);

  for(var i=0;i<count;i++){
    var idx=pickW(poolW,poolTotal);
    winners.push(pool[idx]);
    probs.push((poolW[idx]/poolTotal)*100);
    poolTotal-=poolW[idx];
    pool.splice(idx,1);
    poolW.splice(idx,1);
  }

  /* 依序跑 Slot，最後一次結束後顯示結果 */
  runSlotQueue(winners, probs, 0, count);
}

/* ---- 逐一跑 Slot ---- */
function runSlotQueue(winners, probs, cur, total, onDone){
  if(cur>=total){
    if(onDone) onDone();
    else showFinalResult(winners, probs);
    return;
  }
  var winner=winners[cur];
  var prob=probs[cur];
  startSlot(winner, prob, cur, total, function(){
    runSlotQueue(winners, probs, cur+1, total, onDone);
  });
}

/* ---- 單次 Slot 動畫 ---- */
function startSlot(winner, prob, cur, total, callback){
  var ov=document.getElementById('ov1');
  var sd=document.getElementById('sd');
  var prog=document.getElementById('slotProg');
  var dots=[0,1,2,3,4].map(function(i){return document.getElementById('dt'+i);});

  var finished=false, t1=null, t2=null, to=null;
  function finish(){
    if(finished) return; finished=true;
    if(t1) clearInterval(t1);
    if(t2) clearInterval(t2);
    if(to) clearTimeout(to);
    slotFinish=null;
    dots.forEach(function(d){d.classList.remove('on');});
    sd.classList.remove('roll');
    sd.textContent=winner.name;
    vibrate(60);
    var pause=slotSkip?0:500;
    if(pause===0){ ov.classList.remove('on'); callback(); }
    else setTimeout(function(){ ov.classList.remove('on'); callback(); },pause);
  }
  slotFinish=finish;
  prog.textContent= total>1 ? '第 '+(cur+1)+' / '+total+' 位' : '';

  if(slotSkip){ finish(); return; }

  ov.classList.add('on');
  sd.classList.add('roll');
  sd.textContent='???';
  var dur=1500+Math.random()*1000, di=0;
  t1=setInterval(function(){
    dots.forEach(function(d){d.classList.remove('on');});
    dots[di%5].classList.add('on'); di++;
  },270);
  t2=setInterval(function(){
    sd.textContent=ppl[Math.floor(Math.random()*ppl.length)].name;
  },110);
  to=setTimeout(finish,dur);
}
function skipSlot(){ slotSkip=true; if(slotFinish) slotFinish(); }
/* ---- 重複抽取模式 ---- */
function drawSingleRepeat(){
  if(ppl.length===0){toast('⚠ 請先新增人員',true); return;}
  slotSkip=false; slotFinish=null;
  var count=Math.max(1,parseInt(document.getElementById('drawCount').value,10)||1);
  var pool=[], poolW=[], w=weights();
  for(var i=0;i<ppl.length;i++){
    if(!drawnNames[ppl[i].name]){ pool.push(ppl[i]); poolW.push(w[i]); }
  }
  if(pool.length===0){toast('⚠ 已全部抽完，請重置',true); return;}
  if(pool.length===1&&count>1){toast('⚠ 只剩 1 人，請重置再抽',true); return;}
  if(count>pool.length) count=pool.length;
  var winners=[], probs=[], poolTotal=sumW(poolW);
  for(var n=0;n<count;n++){
    var idx=pickW(poolW,poolTotal);
    winners.push(pool[idx]);
    probs.push((poolW[idx]/poolTotal)*100);
    poolTotal-=poolW[idx];
    pool.splice(idx,1);
    poolW.splice(idx,1);
  }
  runSlotQueue(winners, probs, 0, count, function(){
    for(var n=0;n<winners.length;n++){
      drawnNames[winners[n].name]=true;
      repeatOrder.push(winners[n]);
    }
    render();
    var now=new Date();
    var ts=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+
           ' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
    var rb=document.getElementById('rbox');
    var html='';
    for(var k=0;k<repeatOrder.length;k++){
      html+='<div style="margin:2px 0;font-size:.95rem;font-weight:700;color:#4a5568">#'+(k+1)+' 🎯 '+eh(repeatOrder[k].name)+'</div>';
    }
    rb.innerHTML=html;
    var names=[];
    for(var n=0;n<winners.length;n++){
      names.push(winners[n].name+'（加權'+winners[n].days+'，'+probs[n].toFixed(1)+'%）');
    }
    pushH(ts+' → '+names.join('、'), probs.some(function(p){return p<3;}));
    rb.classList.remove('flash'); void rb.offsetWidth; rb.classList.add('flash');
    var anyChosen=probs.some(function(p){return p<3;});
    if(winners.length===1){
      if(probs[0]<3) setTimeout(function(){ showChosen([winners[0]],[probs[0]]); },400);
      else setTimeout(function(){ showLoser([winners[0]]); },400);
    } else {
      if(anyChosen) setTimeout(function(){ showChosen(winners,probs); },400);
      else setTimeout(function(){ showLoser(winners); },400);
    }
    var rem=0; for(var j=0;j<ppl.length;j++) if(!drawnNames[ppl[j].name]) rem++;
    if(rem===0){ toast('✅ 全員皆已抽出，請按「重置抽籤」',false); }
  });
}
function toggleRepeat(){
  repeatOn=!repeatOn;
  var btn=document.getElementById('btnRepeat');
  if(repeatOn){
    btn.classList.add('on'); btn.textContent='🔁 重複抽取(開啟)';
    toast('🔁 重複抽取模式 已開啟');
  } else {
    drawnNames={}; repeatOrder=[];
    document.getElementById('rbox').innerHTML='<div class="rw">尚未抽籤，請先新增人員再按「開始抽籤」</div>';
    btn.classList.remove('on'); btn.textContent='🔁 重複抽取(關閉)';
    render();
    toast('🔁 重複抽取模式 已關閉（已重置）');
  }
}
function resetDraw(){
  drawnNames={}; repeatOrder=[]; repeatOn=false;
  var btn=document.getElementById('btnRepeat');
  btn.classList.remove('on'); btn.textContent='🔁 重複抽取(關閉)';
  document.getElementById('rbox').innerHTML='<div class="rw">尚未抽籤，請先新增人員再按「開始抽籤」</div>';
  render();
  toast('🔄 已重置抽籤');
}

/* ---- 顯示最終結果 ---- */
function showFinalResult(winners, probs){
  var rb=document.getElementById('rbox');
  var now=new Date();
  var ts=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+
         ' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
  if(winners.length===1){
    var w=winners[0], p=probs[0];
    rb.innerHTML=
      '<div class="rwin">🎯 '+eh(w.name)+'</div>';
    pushH(ts+' → '+w.name+'（'+p.toFixed(1)+'%）', p<3);
    if(p<3){
      setTimeout(function(){ showChosen([w],[p]); },400);
    } else {
      setTimeout(function(){ showLoser([w]); },400);
    }
  } else {
    var tags='', names=[], anyChosen=false;
    for(var i=0;i<winners.length;i++){
      tags+='<span class="rtag">'+(i+1)+'. '+eh(winners[i].name)+'</span>';
      names.push(winners[i].name+'（加權'+winners[i].days+'，'+probs[i].toFixed(1)+'%）');
      if(probs[i]<3) anyChosen=true;
    }
    rb.innerHTML=
      '<div class="rwin">🎯 本次抽出 '+winners.length+' 人</div>'+
      '<div class="rtags">'+tags+'</div>';
    pushH(ts+' → '+names.join('、'), anyChosen);
    if(anyChosen){
      setTimeout(function(){ showChosen(winners,probs); },400);
    } else {
      setTimeout(function(){ showLoser(winners); },400);  // ← 直接傳 winners
    }
  }
  rb.classList.remove('flash'); void rb.offsetWidth; rb.classList.add('flash');
}
/* ---- 就是你啦 卡片 ---- */
function showLoser(people){
  var card=document.getElementById('chosenCard');
  card.classList.remove('chosen-mode');
  card.classList.add('loser-mode');
  document.getElementById('ccrown').textContent='💥';
  document.getElementById('cname').style.display='none';
  document.getElementById('clist').style.display='none';
  document.getElementById('csub').style.display='none';
  document.getElementById('cprob').style.display='none';
  document.querySelector('#chosenCard .clbl').textContent='✦ 就 是 你 啦 ✦';
  if(people.length===1){
    document.getElementById('cname').textContent=people[0].name;
    document.getElementById('cname').style.display='block';
    document.getElementById('csub').style.display='block';
  } else {
    var html='';
    for(var i=0;i<people.length;i++){
      html+='<span class="ctag">'+(i+1)+'. '+eh(people[i].name)+'</span>';
    }
    document.getElementById('clist').innerHTML=html;
    document.getElementById('clist').style.display='flex';
    document.getElementById('csub').textContent='共 '+people.length+' 位';
    document.getElementById('csub').style.display='block';
  }
  document.getElementById('ov2').classList.add('on');
  launchConfetti();
}
/* ---- 天選之人卡片 ---- */
function showChosen(winners, probs){
  var card=document.getElementById('chosenCard');
  card.classList.remove('loser-mode');
  card.classList.add('chosen-mode');
  document.getElementById('ccrown').textContent='👑';
  var isSingle = winners.length===1;
  if(isSingle){
    /* 單人：顯示姓名＋詳細資訊 */
    document.getElementById('cname').textContent  = winners[0].name;
    document.getElementById('cname').style.display = 'block';
    document.getElementById('clist').style.display = 'none';
    document.getElementById('cprob').textContent  = '加權極低卻仍中獎，僅 '+probs[0].toFixed(1)+'% 機率 🔥';
    document.getElementById('cprob').style.display = 'inline-block';
  } else {
    /* 多人：用標籤列表 */
    document.getElementById('cname').style.display = 'none';
    document.getElementById('clist').style.display = 'flex';
    var html='';
    for(var i=0;i<winners.length;i++){
      html+='<span class="ctag">'+(i+1)+'. '+eh(winners[i].name)+'</span>';
    }
    document.getElementById('clist').innerHTML = html;
    document.getElementById('csub').textContent  = '共 '+winners.length+' 位天選之人';
    document.getElementById('cprob').style.display = 'none';
  }
  document.getElementById('ov2').classList.add('on');
  launchConfetti();
}
function closeChosen(){
  document.getElementById('ov2').classList.remove('on');
  var card=document.getElementById('chosenCard');
  card.classList.remove('chosen-mode');
  card.classList.remove('loser-mode');
  document.getElementById('ccrown').textContent='👑';
  // 關閉時還原標題
  document.querySelector('#chosenCard .clbl').textContent = '✦ 天 選 之 人 ✦';
  if(cfId){ cancelAnimationFrame(cfId); cfId=null; }
  var c=document.getElementById('cv');
  c.getContext('2d').clearRect(0,0,c.width,c.height);
}
/* ===== 彩帶動畫加強版 ===== */
function launchConfetti(){
  var c=document.getElementById('cv');
  c.width=window.innerWidth;
  c.height=window.innerHeight;
  var ctx=c.getContext('2d');
  var cols=[
    '#ffd700','#ff8c00','#ff4500',
    '#667eea','#764ba2','#48bb78',
    '#fc8181','#b794f4','#4affb4','#f6e05e'
  ];
  var parts=[];
  // 產生 250 個粒子（比原本多）
  for(var i=0;i<250;i++){
    var shape=Math.random()<0.3?'circle':'rect'; // 30% 是圓形
    parts.push({
      x:Math.random()*c.width,
      y:-20 - Math.random()*200, // 不同高度出發，分批落下
      w:5+Math.random()*11,
      h:4+Math.random()*7,
      r:3+Math.random()*5,       // 圓形半徑
      color:cols[Math.floor(Math.random()*cols.length)],
      vx:(Math.random()-.5)*6,
      vy:1.5+Math.random()*4,
      rot:Math.random()*360,
      vr:(Math.random()-.5)*8,
      alpha:1,
      shape:shape,
      // 飄動效果用的參數
      swing:Math.random()*2,
      swingSpeed:0.02+Math.random()*0.03,
      swingOffset:Math.random()*Math.PI*2,
    });
  }
  var tick=0;
  function frame(){
    ctx.clearRect(0,0,c.width,c.height);
    tick++;
    var alive=false;
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      // 左右飄動
      p.x += p.vx + Math.sin(tick*p.swingSpeed + p.swingOffset)*p.swing;
      p.y += p.vy;
      p.rot += p.vr;
      // 快落出畫面時漸漸透明
      if(p.y > c.height*0.75){
        p.alpha = Math.max(0, 1-(p.y-c.height*0.75)/(c.height*0.25));
      }
      if(p.y < c.height+30) alive=true;
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      if(p.shape==='circle'){
        // 圓形粒子
        ctx.beginPath();
        ctx.arc(0,0,p.r,0,Math.PI*2);
        ctx.fill();
      } else {
        // 矩形粒子
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      ctx.restore();
    }
    if(alive) cfId=requestAnimationFrame(frame);
  }
  if(cfId) cancelAnimationFrame(cfId);
  cfId=requestAnimationFrame(frame);
}
/* ---- CSV 匯入 ---- */
function importCSV(e){
  var file=e.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var lines=ev.target.result.replace(/\r/g,'').replace(/^\ufeff/,'').split('\n');
    var added=0;
    for(var i=0;i<lines.length;i++){
      var line=lines[i].trim(); if(!line) continue;
      var parts=line.split(',');
      var name='', days=0;
      if(parts.length===1){ name=parts[0].trim(); }
      else if(parts.length>=2){ name=parts[1].trim()||parts[0].trim(); days=parseFloat(parts[2])||0; }
      if(!name) continue;
      if(/^(姓名|名字|name)$/i.test(name)) continue;
      var dup=false;
      for(var j=0;j<ppl.length;j++){ if(ppl[j].name===name){ dup=true; break; } }
      if(dup) continue;
      ppl.push({name:name,days:days}); added++;
    }
    if(added>0){ jSave(SK_P,ppl); render(); toast('📥 已匯入 '+added+' 人'); }
    else { toast('⚠ 無有效資料或全部重複',true); }
    e.target.value='';
  };
  reader.readAsText(file,'UTF-8');
}
/* ---- 啟動 ---- */
window.onload=function(){
  ppl  = jLoad(SK_P) || [];
  hist = jLoad(SK_H) || [];
  render();
  renderH();
  document.getElementById('btnAdd').addEventListener('click', addPerson);
  document.getElementById('btnRefresh').addEventListener('click', render);
  document.getElementById('btnDraw').addEventListener('click', drawLottery);
  document.getElementById('btnRepeat').addEventListener('click', toggleRepeat);
  document.getElementById('btnReset').addEventListener('click', resetDraw);
  document.getElementById('btnSave').addEventListener('click', saveData);
  document.getElementById('btnClear').addEventListener('click', clearHist);
  document.getElementById('btnClearPpl').addEventListener('click', clearPpl);
  document.getElementById('btnClose').addEventListener('click', closeChosen);
  document.getElementById('btnSkip').addEventListener('click', skipSlot);
  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('csvFile').click();
  });
  document.getElementById('csvFile').addEventListener('change', importCSV);
  document.getElementById('iName').addEventListener('keydown',function(e){
    if(e.key==='Enter') document.getElementById('iDays').focus();
  });
  document.getElementById('iDays').addEventListener('keydown',function(e){
    if(e.key==='Enter') addPerson();
  });
  document.getElementById('drawCount').addEventListener('input',function(){
    var v=this.value;
    if(v==='') return;
    var n=parseInt(v,10);
    this.value=isNaN(n)?'':String(n);
  });
  document.getElementById('drawCount').addEventListener('blur',function(){
    var n=parseInt(this.value,10);
    if(isNaN(n)||n<1) this.value='1';
    else if(n>50) this.value='50';
  });
};
