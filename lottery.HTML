<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加權抽抽抽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.box{max-width:820px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.hdr{background:linear-gradient(135deg,#667eea,#764ba2);padding:28px;text-align:center;color:#fff}
.hdr h1{font-size:1.9rem;letter-spacing:2px;margin-bottom:4px}
.hdr p{font-size:.9rem;opacity:.85}
.sec{padding:22px 28px;border-bottom:1px solid #e8edf2}
.sec:last-child{border-bottom:none}
.stitle{font-size:1rem;font-weight:700;color:#4a5568;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stitle::before{content:"";width:4px;height:18px;background:linear-gradient(#667eea,#764ba2);border-radius:2px}
.add-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;background:#faf5ff;border:2px dashed #b794f4;border-radius:12px;margin-bottom:14px}
.add-row input[type=text]{flex:1;min-width:110px;max-width:180px;padding:8px 11px;border:2px solid #b794f4;border-radius:8px;font-size:.95rem;font-family:inherit;outline:none}
.add-row input[type=number]{width:88px;padding:8px 11px;border:2px solid #b794f4;border-radius:8px;font-size:.95rem;font-family:inherit;outline:none;text-align:center}
.add-row input:focus{border-color:#667eea}
.tw{overflow-x:auto;border-radius:10px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
thead tr{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
th{padding:11px 12px;text-align:center;font-weight:700;white-space:nowrap}
tbody tr:nth-child(odd){background:#f9fafb}
tbody tr:nth-child(even){background:#fff}
tbody tr:hover{background:#edf2ff}
tbody tr.zrow{background:#f0fff4!important}
tbody tr.zrow:hover{background:#c6f6d5!important}
td{padding:9px 12px;text-align:center;vertical-align:middle}
.ni{width:100%;padding:6px 8px;border:2px solid #e2e8f0;border-radius:7px;font-size:.9rem;text-align:center;outline:none;font-family:inherit;background:transparent}
.ni:focus{border-color:#667eea;background:#fff}
.di{width:80px;padding:6px 8px;border:2px solid #e2e8f0;border-radius:7px;font-size:.92rem;text-align:center;font-weight:700;outline:none;font-family:inherit;background:transparent}
.dz{border-color:#48bb78!important;background:#f0fff4!important;color:#276749!important}
.dn{border-color:#fc8181!important;background:#fff5f5!important;color:#c53030!important}
.pcell{min-width:130px}
.pbar-bg{background:#e2e8f0;border-radius:20px;height:9px;overflow:hidden;margin-top:4px}
.pbar-fill{height:9px;border-radius:20px;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .4s}
.ptxt{font-size:.88rem;font-weight:700;color:#553c9a}
.bdg{display:inline-block;font-size:.7rem;border-radius:9px;padding:1px 6px;margin-left:3px;font-weight:700}
.bgg{background:#c6f6d5;color:#276749}
.bgr{background:#fed7e2;color:#c53030}
.dbtn{background:none;border:none;cursor:pointer;font-size:1rem;padding:3px 7px;border-radius:6px}
.dbtn:hover{background:#fed7e2}
/* 操作區 */
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:18px 28px;border-bottom:1px solid #e8edf2;background:#f9fafb}
.count-wrap{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 14px;border-radius:10px;border:2px solid #e2e8f0}
.count-wrap label{font-size:.88rem;color:#4a5568;font-weight:700;white-space:nowrap}
.count-inp{width:64px;padding:6px 8px;border:2px solid #b794f4;border-radius:8px;font-size:.95rem;font-family:inherit;outline:none;text-align:center;font-weight:700}
.count-inp:focus{border-color:#667eea}
.btn{padding:8px 18px;border:none;border-radius:8px;font-size:.92rem;font-family:inherit;cursor:pointer;font-weight:700;white-space:nowrap;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.btn:active{transform:translateY(0)}
.bs{background:linear-gradient(135deg,#48bb78,#38a169);color:#fff}
.bw{background:linear-gradient(135deg,#f6ad55,#ed8936);color:#fff}
.bd{background:linear-gradient(135deg,#fc8181,#e53e3e);color:#fff}
.bi{background:linear-gradient(135deg,#63b3ed,#3182ce);color:#fff}
.blg{padding:12px 34px;font-size:1.05rem}
.bsm{padding:5px 13px;font-size:.83rem}
/* 結果 */
.rbox{margin:22px 28px;border-radius:14px;padding:22px;text-align:center;background:#f7f5ff;border:2px dashed #b794f4;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rbox.flash{animation:rp .5s ease;background:linear-gradient(135deg,#fff5f5,#fef2f2);border-color:#fc8181}
@keyframes rp{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.rw{font-size:.95rem;color:#a0aec0}
.rwin{font-size:1.5rem;font-weight:700;color:#e53e3e}
.rdet{font-size:.85rem;color:#718096}
.rtags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.rtag{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:5px 16px;border-radius:20px;font-size:.95rem;font-weight:700}
/* 歷史 */
.hlist{list-style:none;display:flex;flex-direction:column;gap:5px;max-height:180px;overflow-y:auto}
.hlist li{padding:6px 11px;background:#f7f5ff;border-left:4px solid #667eea;border-radius:0 6px 6px 0;font-size:.86rem;color:#4a5568}
.hlist li.hc{background:#fffff0;border-left-color:#f6e05e}
.hemp{color:#a0aec0;font-size:.88rem;text-align:center;padding:8px}
/* Slot overlay */
#ov1{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;justify-content:center;align-items:center}
#ov1.on{display:flex}
.slot{background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460);border:3px solid #f6ad55;border-radius:18px;padding:40px 56px;text-align:center;box-shadow:0 0 70px rgba(246,173,85,.4);min-width:300px}
.stit{color:#f6ad55;font-size:1rem;letter-spacing:4px;margin-bottom:24px;animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.sdisp{background:#050505;border:2px solid #4a9eff;border-radius:11px;padding:16px 26px;font-size:2rem;font-weight:700;color:#4affb4;min-width:210px;min-height:64px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 20px rgba(74,159,255,.2)}
.sdisp.roll{animation:cs .12s infinite}
@keyframes cs{0%{color:#4affb4}25%{color:#f6ad55}50%{color:#fc8181}75%{color:#b794f4}100%{color:#4affb4}}
.sdots{margin-top:20px;display:flex;gap:10px;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:#2d3748;transition:all .3s}
.dot.on{background:#f6ad55;box-shadow:0 0 8px #f6ad55}
/* 進度提示（多人抽籤用） */
.slot-prog{color:#a0aec0;font-size:.88rem;margin-top:14px;letter-spacing:1px}

/* ===== 天選之人 Overlay 加強版 ===== */
#ov2{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.75);
}
#ov2.on{
  display:flex;  /* 一定要是 flex，才能讓子元素置中 */
  animation:bgPulse 2s ease-in-out infinite;
}
/* 加入這段（原本完全沒有 #cv 的樣式） */
#cv{
  position:fixed;  /* 脫離 flex 排版，不佔位置 */
  inset:0;
  pointer-events:none;
  z-index:2001;    /* 在卡片下面，彩帶在卡片上飄 */
}
@keyframes bgPulse{
  0%,100%{background:rgba(0,0,0,.75)}
  50%{background:rgba(30,0,60,.85)}
}
/* 白底卡片本體 */
.chosen-card{
  position:relative;
  z-index:2002;    /* 比 canvas 高，卡片永遠在最上層 */
  background:linear-gradient(160deg,#fff 60%,#f3e8ff 100%);
  border-radius:24px;
  padding:44px 52px 36px;
  text-align:center;
  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    0 0 0 4px #ffd700,
    0 0 40px rgba(255,215,0,.6),
    0 0 80px rgba(255,215,0,.3);
  animation:pop .8s cubic-bezier(.34,1.56,.64,1),
            cardGlow 2s ease-in-out infinite .8s;
  max-width:420px;
  width:90%;
  overflow:hidden;
}
/* 卡片金色光掃特效 */
.chosen-card::before{
  content:"";
  position:absolute;top:0;left:-100%;
  width:60%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
  animation:shine 2.5s ease-in-out infinite 1s;
  pointer-events:none;
}
@keyframes shine{
  0%{left:-100%}
  40%,100%{left:150%}
}
/* 卡片持續發光脈動 */
@keyframes cardGlow{
  0%,100%{
    box-shadow:
      0 20px 60px rgba(0,0,0,.35),
      0 0 0 4px #ffd700,
      0 0 40px rgba(255,215,0,.6),
      0 0 80px rgba(255,215,0,.3);
  }
  50%{
    box-shadow:
      0 20px 60px rgba(0,0,0,.35),
      0 0 0 4px #ffd700,
      0 0 60px rgba(255,215,0,.9),
      0 0 120px rgba(255,215,0,.5);
  }
}
@keyframes pop{
  0%{transform:scale(0) rotate(-10deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}
/* 皇冠（加大＋更明顯的浮動） */
.ccrown{
  font-size:5.5rem;
  animation:crownFloat 1.8s ease-in-out infinite;
  display:block;margin-bottom:4px;
  filter:drop-shadow(0 0 12px rgba(255,215,0,.9));
}
@keyframes crownFloat{
  0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}
  50%{transform:translateY(-16px) rotate(5deg) scale(1.1)}
}
/* 標題文字（彩虹流光） */
.clbl{
  font-size:1.2rem;
  letter-spacing:6px;
  margin:6px 0 14px;
  font-weight:700;
  background:linear-gradient(90deg,#667eea,#f6ad55,#fc8181,#764ba2,#667eea);
  background-size:200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:rainbow 3s linear infinite;
}
@keyframes rainbow{
  0%{background-position:0%}
  100%{background-position:200%}
}
/* 得獎者名字（加大＋文字陰影＋跳動） */
.cname{
  font-size:3.6rem;font-weight:700;
  color:#2d3748;margin:6px 0;
  animation:nameJump 1s ease-in-out infinite .8s;
  text-shadow:2px 2px 0 rgba(102,126,234,.2);
}
@keyframes nameJump{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}
/* 機率標籤（閃爍紅色） */
.cprob{
  font-size:.85rem;color:#e53e3e;font-weight:700;
  margin-top:8px;background:#fff5f5;
  padding:5px 14px;border-radius:20px;display:inline-block;
  animation:probBlink 1.2s ease-in-out infinite;
  border:1px solid #fc8181;
}
@keyframes probBlink{
  0%,100%{
    background:#fff5f5;
    box-shadow:0 0 0 rgba(252,129,129,0);
  }
  50%{
    background:#fed7e2;
    box-shadow:0 0 12px rgba(252,129,129,.6);
  }
}
/* 確認按鈕（加強 hover） */
.cbtn{
  margin-top:24px;padding:11px 38px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:none;border-radius:28px;
  font-size:1rem;font-weight:700;color:#fff;
  cursor:pointer;font-family:inherit;
  transition:transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.cbtn::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);
  opacity:0;transition:opacity .2s;
}
.cbtn:hover{
  transform:scale(1.08);
  box-shadow:0 8px 24px rgba(102,126,234,.6);
}
.cbtn:hover::after{opacity:1;}
.cbtn:active{transform:scale(.97)}

</style>
</head>
<body>
<div class="box">
  <div class="hdr">
    <h1>命運抽籤程式</h1>
    <p>加權越多，抽中機率越低 ／ 零天數者大幅加權</p>
  </div>

  <div class="sec">
    <div class="stitle">人員管理</div>
    <div class="add-row">
      <strong style="color:#553c9a;white-space:nowrap">➕ 新增</strong>
      <input type="text"   id="iName" placeholder="姓名" maxlength="20">
      <input type="number" id="iDays" placeholder="天數" min="0" max="999" value="0">
      <button class="btn bs" id="btnAdd">＋ 新增</button>
    </div>
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>姓名</th>
            <th>加權天數（參考行事曆）</th>
            <th>抽中機率</th>
            <th style="width:46px">移除</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <div class="acts">
    <div class="count-wrap">
      <label>🎯 本次抽取</label>
      <input type="number" id="drawCount" class="count-inp" value="1" min="1" max="50">
      <label>人</label>
    </div>
    <button class="btn bs"     id="btnRefresh">🔄 更新機率</button>
    <button class="btn bw blg" id="btnDraw">🎲 開始抽籤</button>
    <button class="btn bi bsm" id="btnSave">💾 儲存人員</button>
    <button class="btn bd bsm" id="btnClear">🗑 清除紀錄</button>
  </div>

  <div class="rbox" id="rbox">
    <div class="rw">尚未抽籤，請先新增人員再按「開始抽籤」</div>
  </div>

  <div class="sec">
    <div class="stitle">抽籤歷史</div>
    <ul class="hlist" id="hl"><li class="hemp">尚無紀錄</li></ul>
  </div>
</div>

<!-- Slot Overlay -->
<div id="ov1">
  <div class="slot">
    <div class="stit">▶ 抽 籤 進 行 中 ◀</div>
    <div class="sdisp" id="sd">???</div>
    <div class="sdots">
      <div class="dot" id="dt0"></div><div class="dot" id="dt1"></div>
      <div class="dot" id="dt2"></div><div class="dot" id="dt3"></div>
      <div class="dot" id="dt4"></div>
    </div>
    <div class="slot-prog" id="slotProg"></div>
  </div>
</div>

<!-- 天選之人 Overlay（白底卡片） -->
<div id="ov2">
  <canvas id="cv"></canvas>
  <div class="chosen-card" id="chosenCard">
    <span class="ccrown" id="ccrown">👑</span>
    <div class="clbl">✦ 天 選 之 人 ✦</div>
    <div class="cname"  id="cname"></div>
    <div class="clist"  id="clist"></div>
    <div class="csub"   id="csub"></div>
    <div class="cprob"  id="cprob"></div>
    <button class="cbtn" id="btnClose">我認命了</button>
  </div>
</div>

<div id="toast"></div>

<script>
var SK_P='lp6_ppl', SK_H='lp6_hist';
var BASE=10000, PWR=1.585;
var ppl=[], hist=[], cfId=null;

/* ---- 工具 ---- */
function jLoad(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function jSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function eh(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,w){
  var t=document.getElementById('toast');
  t.textContent=m; t.style.background=w?'#c53030':'#2d3748';
  t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},2400);
}

/* ---- 權重 ---- */
function weights(){
  return ppl.map(function(p){
    return BASE / Math.pow(p.days + 1, PWR);
  });
}
function sumW(w){var s=0;for(var i=0;i<w.length;i++)s+=w[i];return s;}
function pickW(w){
  var s=sumW(w),r=Math.random()*s;
  for(var i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}
  return w.length-1;
}

/* ---- 渲染表格 ---- */
function render(){
  var tb=document.getElementById('tb');
  tb.innerHTML='';
  if(ppl.length===0){
    tb.innerHTML='<tr><td colspan="5" style="padding:18px;color:#a0aec0">尚無人員，請在上方新增</td></tr>';
    return;
  }
  var w=weights(), tw=sumW(w);
  for(var i=0;i<ppl.length;i++){
    (function(i){
      var p=ppl[i], prob=(w[i]/tw)*100;
      var tr=document.createElement('tr');
      if(p.days===0) tr.className='zrow';
      var bdg='';
      if(p.days===0) bdg='<span class="bdg bgg">🔝最高</span>';
      else if(prob<10) bdg='<span class="bdg bgr">⚠低</span>';
      tr.innerHTML=
        '<td style="color:#a0aec0">'+(i+1)+'</td>'+
        '<td><input class="ni" type="text" value="'+eh(p.name)+'" id="n'+i+'"></td>'+
        '<td><input class="di '+(p.days===0?'dz':'dn')+'" type="number" value="'+p.days+'" min="0" max="999" id="d'+i+'"></td>'+
        '<td class="pcell" id="pc'+i+'">'+
          '<div class="ptxt">'+prob.toFixed(1)+'%'+bdg+'</div>'+
          '<div class="pbar-bg"><div class="pbar-fill" style="width:'+Math.min(100,prob).toFixed(1)+'%"></div></div>'+
        '</td>'+
        '<td><button class="dbtn" id="del'+i+'">🗑</button></td>';
      tb.appendChild(tr);
      document.getElementById('n'+i).addEventListener('change',function(){
        ppl[i].name=this.value.trim()||'人員'+(i+1);
      });
      document.getElementById('d'+i).addEventListener('input',function(){
        var d=Math.max(0,parseInt(this.value)||0);
        ppl[i].days=d;
        this.className='di '+(d===0?'dz':'dn');
        var row=this.closest('tr');
        if(row) row.className=d===0?'zrow':'';
        refreshP();
      });
      document.getElementById('del'+i).addEventListener('click',function(){
        if(!confirm('移除「'+ppl[i].name+'」？')) return;
        var nm=ppl[i].name; ppl.splice(i,1); render();
        toast('🗑 已移除「'+nm+'」');
      });
    })(i);
  }
}

function refreshP(){
  if(!ppl.length) return;
  var w=weights(),tw=sumW(w);
  for(var i=0;i<ppl.length;i++){
    var c=document.getElementById('pc'+i); if(!c) continue;
    var prob=(w[i]/tw)*100;
    var bdg='';
    if(ppl[i].days===0) bdg='<span class="bdg bgg">🔝最高</span>';
    else if(prob<10) bdg='<span class="bdg bgr">⚠低</span>';
    c.querySelector('.ptxt').innerHTML=prob.toFixed(1)+'%'+bdg;
    c.querySelector('.pbar-fill').style.width=Math.min(100,prob).toFixed(1)+'%';
  }
}

/* ---- 新增人員 ---- */
function addPerson(){
  var ne=document.getElementById('iName'), de=document.getElementById('iDays');
  var name=ne.value.trim(), days=Math.max(0,parseInt(de.value)||0);
  if(!name){toast('⚠ 請輸入姓名',true); ne.focus(); return;}
  for(var i=0;i<ppl.length;i++){
    if(ppl[i].name===name){toast('⚠ 姓名重複',true); ne.focus(); return;}
  }
  ppl.push({name:name,days:days});
  ne.value=''; de.value='0'; ne.focus();
  render();
  toast('✅ 已新增「'+name+'」');
}

/* ---- 儲存/清除 ---- */
function saveData(){
  if(!ppl.length){toast('⚠ 尚無人員',true); return;}
  jSave(SK_P,ppl); toast('💾 已儲存 '+ppl.length+' 筆');
}
function clearHist(){
  if(!confirm('確定清除所有紀錄？')) return;
  hist=[]; jSave(SK_H,hist); renderH(); toast('🗑 已清除');
}

/* ---- 歷史 ---- */
function renderH(){
  var ul=document.getElementById('hl'); ul.innerHTML='';
  if(!hist.length){ul.innerHTML='<li class="hemp">尚無紀錄</li>'; return;}
  for(var i=hist.length-1;i>=0;i--){
    var li=document.createElement('li');
    if(hist[i].c) li.className='hc';
    li.textContent=hist[i].t; ul.appendChild(li);
  }
}
function pushH(t,c){hist.push({t:t,c:!!c}); jSave(SK_H,hist); renderH();}

/* ---- 抽籤主流程 ---- */
function drawLottery(){
  var count=Math.max(1,parseInt(document.getElementById('drawCount').value)||1);
  if(ppl.length===0){toast('⚠ 請先新增人員',true); return;}
  if(ppl.length<2){toast('⚠ 至少需要 2 位人員',true); return;}
  if(count>ppl.length){toast('⚠ 抽取人數不能超過總人數（'+ppl.length+'人）',true); return;}

  /* 不放回抽樣 */
  var w=weights(), tw=sumW(w);
  var pool=ppl.slice();   /* 複製陣列，不影響原始 */
  var poolW=w.slice();
  var winners=[];
  var probs=[];

  for(var i=0;i<count;i++){
    var idx=pickW(poolW);
    winners.push(pool[idx]);
    probs.push((poolW[idx]/sumW(poolW))*100);
    pool.splice(idx,1);
    poolW.splice(idx,1);
  }

  /* 依序跑 Slot，最後一次結束後顯示結果 */
  runSlotQueue(winners, probs, 0, count);
}

/* ---- 逐一跑 Slot ---- */
function runSlotQueue(winners, probs, cur, total){
  if(cur>=total){
    /* 全部抽完，顯示最終結果 */
    showFinalResult(winners, probs);
    return;
  }
  var winner=winners[cur];
  var prob=probs[cur];
  startSlot(winner, prob, cur, total, function(){
    runSlotQueue(winners, probs, cur+1, total);
  });
}

/* ---- 單次 Slot 動畫 ---- */
function startSlot(winner, prob, cur, total, callback){
  var ov=document.getElementById('ov1');
  var sd=document.getElementById('sd');
  var prog=document.getElementById('slotProg');
  var dots=[0,1,2,3,4].map(function(i){return document.getElementById('dt'+i);});

  ov.classList.add('on');
  sd.classList.add('roll');
  sd.textContent='???';
  prog.textContent= total>1 ? '第 '+(cur+1)+' / '+total+' 位' : '';

  var dur=1500+Math.random()*1000, di=0;
  var t1=setInterval(function(){
    dots.forEach(function(d){d.classList.remove('on');});
    dots[di%5].classList.add('on'); di++;
  },270);
  var t2=setInterval(function(){
    sd.textContent=ppl[Math.floor(Math.random()*ppl.length)].name;
  },110);

  setTimeout(function(){
    clearInterval(t1); clearInterval(t2);
    dots.forEach(function(d){d.classList.remove('on');});
    sd.classList.remove('roll');
    sd.textContent=winner.name;
    setTimeout(function(){
      ov.classList.remove('on');
      callback();
    },500);
  },dur);
}
/* ---- 顯示最終結果 ---- */
function showFinalResult(winners, probs){
  var rb=document.getElementById('rbox');
  var now=new Date();
  var ts=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+
         ' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
  if(winners.length===1){
    var w=winners[0], p=probs[0];
    rb.innerHTML=
      '<div class="rwin">🎯 '+eh(w.name)+'</div>';
    pushH(ts+' → '+w.name+'（'+p.toFixed(1)+'%）', p<10);
    if(p<10){
      setTimeout(function(){ showChosen([w],[p]); },400);
    } else {
      setTimeout(function(){ showLoser([w]); },400);
    }
  } else {
    var tags='', names=[], anyChosen=false;
    for(var i=0;i<winners.length;i++){
      tags+='<span class="rtag">'+eh(winners[i].name)+'</span>';
      names.push(winners[i].name+'（'+winners[i].days+'天，'+probs[i].toFixed(1)+'%）');
      if(probs[i]<10) anyChosen=true;
    }
    rb.innerHTML=
      '<div class="rwin">🎯 本次抽出 '+winners.length+' 人</div>'+
      '<div class="rtags">'+tags+'</div>';
    pushH(ts+' → '+names.join('、'), anyChosen);
    if(anyChosen){
      setTimeout(function(){ showChosen(winners,probs); },400);
    } else {
      setTimeout(function(){ showLoser(winners); },400);  // ← 直接傳 winners
    }
  }
  rb.classList.remove('flash'); void rb.offsetWidth; rb.classList.add('flash');
}
/* ---- 就是你啦 卡片 ---- */
function showLoser(people){
  document.getElementById('cname').style.display='none';
  document.getElementById('clist').style.display='none';
  document.getElementById('csub').style.display='none';
  document.getElementById('cprob').style.display='none';
  document.querySelector('#chosenCard .clbl').textContent='✦ 就 是 你 啦 ✦';
  if(people.length===1){
    document.getElementById('cname').textContent=people[0].name;
    document.getElementById('cname').style.display='block';
    document.getElementById('csub').style.display='block';
  } else {
    var html='';
    for(var i=0;i<people.length;i++){
      html+='<span class="ctag">'+eh(people[i].name)+'</span>';
    }
    document.getElementById('clist').innerHTML=html;
    document.getElementById('clist').style.display='flex';
    document.getElementById('csub').textContent='共 '+people.length+' 位';
    document.getElementById('csub').style.display='block';
  }
  document.getElementById('ov2').classList.add('on');
  launchConfetti();
}
/* ---- 天選之人卡片 ---- */
function showChosen(winners, probs){
  var isSingle = winners.length===1;
  if(isSingle){
    /* 單人：顯示姓名＋詳細資訊 */
    document.getElementById('cname').textContent  = winners[0].name;
    document.getElementById('cname').style.display = 'block';
    document.getElementById('clist').style.display = 'none';
    document.getElementById('cprob').textContent  = '抽中機率僅 '+probs[0].toFixed(1)+'%，命中注定 🔥';
    document.getElementById('cprob').style.display = 'inline-block';
  } else {
    /* 多人：用標籤列表 */
    document.getElementById('cname').style.display = 'none';
    document.getElementById('clist').style.display = 'flex';
    var html='';
    for(var i=0;i<winners.length;i++){
      html+='<span class="ctag">'+eh(winners[i].name)+'</span>';
    }
    document.getElementById('clist').innerHTML = html;
    document.getElementById('csub').textContent  = '共 '+winners.length+' 位天選之人';
    document.getElementById('cprob').style.display = 'none';
  }
  document.getElementById('ov2').classList.add('on');
  launchConfetti();
}
function closeChosen(){
  document.getElementById('ov2').classList.remove('on');
  // 關閉時還原標題
  document.querySelector('#chosenCard .clbl').textContent = '✦ 天 選 之 人 ✦';
  if(cfId){ cancelAnimationFrame(cfId); cfId=null; }
  var c=document.getElementById('cv');
  c.getContext('2d').clearRect(0,0,c.width,c.height);
}
/* ===== 彩帶動畫加強版 ===== */
function launchConfetti(){
  var c=document.getElementById('cv');
  c.width=window.innerWidth;
  c.height=window.innerHeight;
  var ctx=c.getContext('2d');
  var cols=[
    '#ffd700','#ff8c00','#ff4500',
    '#667eea','#764ba2','#48bb78',
    '#fc8181','#b794f4','#4affb4','#f6e05e'
  ];
  var parts=[];
  // 產生 250 個粒子（比原本多）
  for(var i=0;i<250;i++){
    var shape=Math.random()<0.3?'circle':'rect'; // 30% 是圓形
    parts.push({
      x:Math.random()*c.width,
      y:-20 - Math.random()*200, // 不同高度出發，分批落下
      w:5+Math.random()*11,
      h:4+Math.random()*7,
      r:3+Math.random()*5,       // 圓形半徑
      color:cols[Math.floor(Math.random()*cols.length)],
      vx:(Math.random()-.5)*6,
      vy:1.5+Math.random()*4,
      rot:Math.random()*360,
      vr:(Math.random()-.5)*8,
      alpha:1,
      shape:shape,
      // 飄動效果用的參數
      swing:Math.random()*2,
      swingSpeed:0.02+Math.random()*0.03,
      swingOffset:Math.random()*Math.PI*2,
    });
  }
  var tick=0;
  function frame(){
    ctx.clearRect(0,0,c.width,c.height);
    tick++;
    var alive=false;
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      // 左右飄動
      p.x += p.vx + Math.sin(tick*p.swingSpeed + p.swingOffset)*p.swing;
      p.y += p.vy;
      p.rot += p.vr;
      // 快落出畫面時漸漸透明
      if(p.y > c.height*0.75){
        p.alpha = Math.max(0, 1-(p.y-c.height*0.75)/(c.height*0.25));
      }
      if(p.y < c.height+30) alive=true;
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      if(p.shape==='circle'){
        // 圓形粒子
        ctx.beginPath();
        ctx.arc(0,0,p.r,0,Math.PI*2);
        ctx.fill();
      } else {
        // 矩形粒子
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      ctx.restore();
    }
    if(alive) cfId=requestAnimationFrame(frame);
  }
  if(cfId) cancelAnimationFrame(cfId);
  cfId=requestAnimationFrame(frame);
}
/* ---- 啟動 ---- */
window.onload=function(){

    if(e.key==='Enter') document.getElementById('iDays').focus();
  });
  document.getElementById('iDays').addEventListener('keydown',function(e){
    if(e.key==='Enter') addPerson();
  });
};
document.getElementById('btnClose').onclick   = function(){ closeChosen(); }
